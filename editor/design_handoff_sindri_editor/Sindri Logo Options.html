<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sindri — Logo options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f6f4ef;
    --paper-2: #efece2;
    --paper-3: #e6e1d1;
    --ink: #1a1a1a;
    --ink-2: #3a3936;
    --ink-3: #6b6862;
    --ink-4: #a8a298;
    --rule: #1a1a1a;
    --orange: #d4541e;
    --navy: #2b4a6f;
    --moss: #5e6b3a;
    --f-display: "Instrument Serif", "Times New Roman", serif;
    --f-sans: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
    --f-mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0a; font-family: var(--f-sans); color: var(--ink); }
  .ab {
    background: var(--paper);
    color: var(--ink);
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow: hidden;
  }
  .ab-name {
    font-family: var(--f-display);
    font-size: 22px;
    font-style: italic;
    color: var(--ink-3);
  }
  .ab-title {
    font-family: var(--f-display);
    font-size: 38px;
    line-height: 1;
    color: var(--ink);
    margin-top: -8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 28px;
    border-top: 1px solid var(--rule);
    padding-top: 18px;
  }
  .meta {
    font-family: var(--f-mono);
    font-size: 10.5;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }
  .small-label {
    font-family: var(--f-sans);
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hero {
    border: 1px solid var(--ink);
    aspect-ratio: 1.5;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-2);
  }
  .scale-row {
    display: flex;
    gap: 22px;
    align-items: flex-end;
    border-top: 1px solid var(--rule);
    padding-top: 14px;
  }
  .scale-cell {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .scale-cell .sz {
    font-family: var(--f-mono);
    font-size: 9px;
    color: var(--ink-3);
  }
  .color-row {
    display: flex;
    gap: 0;
    align-items: stretch;
    border: 1px solid var(--ink);
    height: 28px;
  }
  .color-row > div { flex: 1; display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 9px; }
  .desc {
    font-family: var(--f-display);
    font-style: italic;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink-2);
    max-width: 60ch;
  }
  .lockup {
    font-family: var(--f-display);
    font-size: 56px;
    letter-spacing: 0.02em;
    line-height: 1;
    display: inline-flex;
    align-items: baseline;
    color: var(--ink);
  }
  .lockup .i { font-style: italic; color: var(--orange); }
  .small-lockup {
    font-family: var(--f-display);
    font-size: 22px;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--ink);
  }
  .small-lockup .i { font-style: italic; color: var(--orange); }
  .inv {
    background: var(--ink);
    color: var(--paper);
    padding: 18px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .inv .lockup, .inv .small-lockup { color: var(--paper); }
  .num {
    font-family: var(--f-display);
    font-size: 90px;
    line-height: 1;
    color: var(--paper-3);
    position: absolute;
    right: 24px;
    top: 24px;
    font-style: italic;
  }
  .pad { position: relative; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="js/logo.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function LogoOption({ which, name, tagline, blurb, Mark }) {
  return (
    <div className="ab pad">
      <span className="num">{which === 'anvil' ? '01' : which === 'forge' ? '02' : '03'}</span>
      <div>
        <div className="ab-name">Option · {name.toLowerCase()}</div>
        <div className="ab-title">{name}.</div>
      </div>
      <div className="desc">{blurb}</div>

      <div className="hero">
        <Mark size={240} />
      </div>

      <div className="stack">
        <span className="small-label">Lockup · primary</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 18, borderTop: '1px solid var(--rule)', paddingTop: 14 }}>
          <Mark size={64}/>
          <span className="lockup">S<span className="i">i</span>ndri</span>
        </div>
      </div>

      <div className="stack">
        <span className="small-label">Lockup · inverse</span>
        <div className="inv" style={{ alignSelf: 'flex-start' }}>
          <Mark size={36} color="#f6f4ef" accent="#d4541e"/>
          <span className="small-lockup">S<span className="i">i</span>ndri</span>
        </div>
      </div>

      <div className="stack">
        <span className="small-label">Scale</span>
        <div className="scale-row">
          {[16, 24, 32, 48, 72, 120].map(s => (
            <div key={s} className="scale-cell">
              <Mark size={s}/>
              <span className="sz">{s}px</span>
            </div>
          ))}
        </div>
      </div>

      <div className="stack">
        <span className="small-label">Palette</span>
        <div className="color-row">
          <div style={{ background: '#1a1a1a', color: '#f6f4ef' }}>ink</div>
          <div style={{ background: '#d4541e', color: '#f6f4ef' }}>ember</div>
          <div style={{ background: '#f6f4ef', color: '#1a1a1a', borderLeft: '1px solid var(--ink)', borderRight: '1px solid var(--ink)' }}>paper</div>
        </div>
      </div>

      <div className="meta" style={{ marginTop: 'auto', paddingTop: 14, borderTop: '1px solid var(--rule)' }}>
        <span style={{ color: 'var(--ink)' }}>{tagline}</span>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="logo-options" title="Sindri · Logo options" subtitle="Editorial palette. Single ember accent (#d4541e). Built for 16px favicon to 240px hero.">
        <DCArtboard id="anvil" label="Anvil" width={680} height={1080}>
          <LogoOption
            which="anvil"
            name="Anvil"
            tagline="The dwarf's workbench. Direct, weighty."
            blurb="A negative-space anvil silhouette with an ember mark above it — the spark that just left the hammer. Strong at small sizes because it's almost all silhouette."
            Mark={window.LogoAnvil}
          />
        </DCArtboard>
        <DCArtboard id="forge" label="Forge" width={680} height={1080}>
          <LogoOption
            which="forge"
            name="Forge"
            tagline="Refinement of the original hex. Concentric to a single ember."
            blurb="Two hairline hexagons containing a single ember. Keeps the mythological link to the current mark, but trades the gradient rings for a single confident accent. Scales cleanly because it's pure geometry."
            Mark={window.LogoForge}
          />
        </DCArtboard>
        <DCArtboard id="rune" label="Rune" width={680} height={1080}>
          <LogoOption
            which="rune"
            name="Rune"
            tagline="An angular 'S' as a Norse smith's mark."
            blurb="A monogrammed 'S' built from two diagonal strokes — reads as a brand, a glyph, and a smith's mark all at once. The ember interrupts the stroke at the center, giving the AI accent a structural reason to be there."
            Mark={window.LogoRune}
          />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

setTimeout(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}, 60);
</script>
</body>
</html>
