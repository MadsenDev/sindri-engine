[workspace]
members = [
    "crates/sindri",
    "crates/sindri-server",
    "crates/sindri-ai",
    "examples/hello_sindri",
    "examples/platformer",
    "examples/scripted_asteroids",
    "examples/editor_scene",
    "examples/rendering",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Sindri Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
thiserror = "1"
winit = "0.30"
wgpu = "28"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = "0.17"
ab_glyph = "0.2"
glyphon = "0.10"
rapier2d = "0.14"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
